[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/storage",
    "crates/git",
    "crates/terminal",
    "crates/app",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "5"
